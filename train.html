<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak It Out - Train Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #000000; --bg-secondary: #161617; --bg-tertiary: #1d1d1f;
            --text-primary: #f5f5f7; --text-secondary: #a1a1a6; --text-tertiary: #6e6e73;
            --accent-blue: #2997ff; --accent-purple: #bf5af2; --accent-pink: #ff375f;
            --accent-green: #30d158; --accent-orange: #ff9500;
            --border-color: #3a3a3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; padding-top: 60px;
        }

        .top-nav {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000; padding: 15px 0;
        }
        .top-nav .container {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 800px; margin: 0 auto; padding: 0 20px;
        }
        .top-nav-logo { font-weight: 700; font-size: 1.2rem; color: var(--text-primary); text-decoration: none; }
        .top-nav-links { display: flex; gap: 15px; }
        .top-nav-links a {
            color: var(--text-secondary); text-decoration: none;
            font-size: 0.9rem; padding: 6px 12px; border-radius: 16px; transition: all 0.2s;
        }
        .top-nav-links a:hover { background: var(--accent-blue); color: #fff; }
        .top-nav-links a.active { background: var(--accent-blue); color: #fff; }

        .container { max-width: 700px; margin: 0 auto; padding: 20px; }

        .header { text-align: center; padding: 40px 20px; }
        .header h1 {
            font-size: 2.5rem; font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header p { color: var(--text-secondary); margin-top: 8px; font-size: 1.1rem; }
        .header .zh { color: var(--text-tertiary); font-size: 0.95rem; margin-top: 4px; }

        .train-card {
            background: var(--bg-tertiary); border-radius: 24px; padding: 40px 30px;
            text-align: center; border: 1px solid var(--border-color);
        }

        .counter-row {
            display: flex; justify-content: center; gap: 40px; margin-bottom: 25px; flex-wrap: wrap;
        }
        .counter-item { text-align: center; }
        .counter-value {
            font-size: 3rem; font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .counter-label { color: var(--text-tertiary); font-size: 0.85rem; margin-top: 4px; }

        .word-display {
            background: var(--bg-secondary); border-radius: 20px; padding: 30px;
            margin: 25px 0; border: 2px solid var(--border-color);
            min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
        }
        .word-text {
            font-size: 3rem; font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            transition: all 0.3s;
        }
        .word-text.placeholder { font-size: 1.3rem; color: var(--text-tertiary); -webkit-text-fill-color: var(--text-tertiary); }

        .structure-box {
            background: rgba(48,209,88,0.08); border: 1px solid rgba(48,209,88,0.25);
            border-radius: 12px; padding: 12px 20px; font-size: 1.1rem;
            color: var(--accent-green); font-weight: 500;
            transition: all 0.3s; max-width: 90%;
        }
        .structure-box .label { font-size: 0.75rem; color: var(--text-tertiary); display: block; margin-bottom: 2px; }

        .hint-text { color: var(--text-tertiary); font-size: 0.9rem; margin-bottom: 25px; }

        .btn-row { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 15px 35px; border-radius: 50px; font-size: 1.05rem;
            font-weight: 600; cursor: pointer; border: none; transition: all 0.3s;
        }
        .btn:hover { transform: scale(1.03); }
        .btn-next { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: #fff; }
        .btn-speak { background: var(--accent-green); color: #000; }
        .btn-speak:hover { box-shadow: 0 8px 30px rgba(48,209,88,0.3); }
        .btn-reset { background: transparent; border: 2px solid var(--border-color); color: var(--text-secondary); }

        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        @media (max-width: 600px) {
            .word-text { font-size: 2rem; }
            .header h1 { font-size: 1.8rem; }
            .counter-value { font-size: 2rem; }
            .structure-box { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="container">
            <a href="index.html" class="top-nav-logo">🎓 Speak It Out</a>
            <div class="top-nav-links">
                <a href="index.html">📚 课程 / Course</a>
                <a href="train.html" class="active">🚂 Speak It Out</a>
                <a href="play.html">🎮 游戏 / Play</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>🚂 Speak It Out</h1>
            <p>See a word. Say a sentence. Build your instinct.</p>
            <p class="zh">看到一个词，用句型提示说出完整句子。练到脱口而出！</p>
        </div>

        <div class="train-card">
            <div class="counter-row">
                <div class="counter-item">
                    <div class="counter-value" id="speakCount">0</div>
                    <div class="counter-label">已开口 / Spoken</div>
                </div>
            </div>

            <div class="word-display">
                <div class="word-text placeholder" id="trainWord">点击按钮开始 / Click to Start</div>
                <div class="structure-box hidden" id="structureBox">
                    <span class="label">句子结构 / Sentence Pattern</span>
                    <span id="structureText"></span>
                </div>
            </div>

            <p class="hint-text" id="hintText">💡 先看结构，再用单词造句 / Check the pattern, then make a sentence</p>

            <div class="btn-row">
                <button class="btn btn-next" onclick="nextWord()">🎲 下一个词 / Next Word</button>
                <button class="btn btn-speak" onclick="speakWord()">🔊 TTS 朗读 / Speak</button>
                <button class="btn btn-reset" onclick="resetGame()">↺ 重置 / Reset</button>
            </div>
        </div>
    </div>

    <script>
        // Simpler vocabulary with sentence structure hints
        const wordData = [
            { word: 'hotel', pattern: 'I am staying at a _____. / The _____ is near the airport.' },
            { word: 'reservation', pattern: 'I have a _____. / I would like to make a _____.' },
            { word: 'check in', pattern: 'I want to _____. / What time can I _____?' },
            { word: 'check out', pattern: 'I need to _____. / _____ is at 12 noon.' },
            { word: 'passport', pattern: 'Here is my _____. / I need to show my _____.' },
            { word: 'luggage', pattern: 'This is my _____. / Where can I put my _____?' },
            { word: 'boarding pass', pattern: 'I have my _____. / Please show your _____.' },
            { word: 'gate', pattern: 'Where is the _____? / The _____ is over there.' },
            { word: 'flight', pattern: 'My _____ is delayed. / The _____ takes 2 hours.' },
            { word: 'delay', pattern: 'There is a _____. / The flight has a _____.' },
            { word: 'cancel', pattern: 'I need to _____ my booking. / They had to _____ the meeting.' },
            { word: 'meeting', pattern: 'I have a _____ at 3pm. / The _____ is cancelled.' },
            { word: 'help', pattern: 'Can you _____ me? / I need some _____.' },
            { word: 'sorry', pattern: 'I am _____. / _____ for being late.' },
            { word: 'thank you', pattern: '_____ for your help. / _____ very much.' },
            { word: 'how much', pattern: '_____ does it cost? / _____ is this?' },
            { word: 'where', pattern: '_____ is the bathroom? / _____ can I find a taxi?' },
            { word: 'what time', pattern: '_____ does it start? / _____ is check-out?' },
            { word: 'I would like', pattern: '_____ a coffee. / _____ to book a room.' },
            { word: 'could you', pattern: '_____ help me? / _____ repeat that please?' },
            { word: 'room', pattern: 'The _____ is too noisy. / I need a quiet _____.' },
            { word: 'taxi', pattern: 'I need a _____. / Can you call a _____?' },
            { word: 'wait', pattern: 'Please _____ a moment. / I can _____ here.' },
            { word: 'call', pattern: 'I will _____ you. / Can you _____ the front desk?' },
            { word: 'send', pattern: 'Please _____ me the details. / I will _____ an email.' },
        ];

        let speakCount = 0;
        let lastIdx = -1;

        function nextWord() {
            let idx;
            do { idx = Math.floor(Math.random() * wordData.length); }
            while (idx === lastIdx && wordData.length > 1);
            lastIdx = idx;

            const data = wordData[idx];
            const wordEl = document.getElementById('trainWord');
            wordEl.textContent = data.word;
            wordEl.classList.remove('placeholder');

            document.getElementById('structureText').textContent = data.pattern;
            document.getElementById('structureBox').classList.remove('hidden');

            speakCount++;
            document.getElementById('speakCount').textContent = speakCount;
            if (speakCount >= 10) createConfetti();

            document.getElementById('hintText').innerHTML =
                '💡 用句型「' + data.pattern + '」造句，说出你的版本 / Make your own sentence with the pattern';
        }

        function speakWord() {
            const word = document.getElementById('trainWord').textContent;
            if (word === '点击按钮开始 / Click to Start') return;
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(word);
                u.lang = 'en-US'; u.rate = 0.85;
                speechSynthesis.speak(u);
            }
        }

        function resetGame() {
            speakCount = 0;
            lastIdx = -1;
            document.getElementById('speakCount').textContent = '0';
            document.getElementById('trainWord').textContent = '点击按钮开始 / Click to Start';
            document.getElementById('trainWord').classList.add('placeholder');
            document.getElementById('structureBox').classList.add('hidden');
            document.getElementById('hintText').innerHTML = '💡 先看结构，再用单词造句 / Check the pattern, then make a sentence';
        }

        function createConfetti() {
            const colors = ['#2997ff','#bf5af2','#ff375f','#30d158','#ff9500'];
            for (let i=0;i<50;i++) {
                const el = document.createElement('div');
                el.style.cssText = 'position:fixed;left:'+Math.random()*100+'vw;top:-10px;width:8px;height:8px;background:'+
                    colors[Math.floor(Math.random()*colors.length)]+';border-radius:50%;animation:fall '+
                    (2+Math.random()*2)+'s linear forwards;z-index:9999;pointer-events:none;';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 4000);
            }
        }
    </script>
</body>
</html>
