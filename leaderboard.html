<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak It Out - Global Leaderboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #000000; --bg-secondary: #161617; --bg-tertiary: #1d1d1f;
            --text-primary: #f5f5f7; --text-secondary: #a1a1a6; --text-tertiary: #6e6e73;
            --accent-blue: #2997ff; --accent-green: #30d158; --accent-pink: #ff375f; --border-color: #3a3a3c;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 3rem; font-weight: 700; margin-bottom: 10px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header p { color: var(--text-secondary); font-size: 1.1rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--bg-tertiary); padding: 25px; border-radius: 15px; text-align: center; }
        .stat-card .value { font-size: 2.5rem; font-weight: 700; color: var(--accent-blue); }
        .stat-card .label { color: var(--text-tertiary); font-size: 0.9rem; margin-top: 8px; }
        .leaderboard-card { background: var(--bg-tertiary); border-radius: 20px; padding: 30px; margin-bottom: 30px; }
        .leaderboard-card h2 { font-size: 1.5rem; margin-bottom: 20px; }
        .leaderboard-list { list-style: none; }
        .leaderboard-item { display: flex; align-items: center; padding: 15px; margin: 10px 0; background: var(--bg-secondary); border-radius: 12px; }
        .rank { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; margin-right: 15px; }
        .rank-1 { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; }
        .rank-2 { background: linear-gradient(135deg, #C0C0C0, #808080); color: #000; }
        .rank-3 { background: linear-gradient(135deg, #CD7F32, #8B4513); color: #fff; }
        .rank-other { background: var(--bg-tertiary); color: var(--text-secondary); }
        .player-info { flex: 1; }
        .player-name { font-weight: 600; font-size: 1.1rem; }
        .player-date { font-size: 0.8rem; color: var(--text-tertiary); }
        .player-time { font-weight: 700; color: var(--accent-blue); font-size: 1.2rem; }
        .player-accuracy { margin-left: 15px; padding: 5px 12px; background: rgba(48, 209, 88, 0.1); color: var(--accent-green); border-radius: 20px; font-size: 0.85rem; }
        .btn { background: var(--accent-blue); color: #fff; border: none; padding: 12px 25px; border-radius: 50px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { transform: scale(1.05); }
        .btn-secondary { background: var(--bg-secondary); border: 2px solid var(--border-color); }
        .submit-form { background: var(--bg-tertiary); border-radius: 15px; padding: 25px; margin-bottom: 30px; }
        .form-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .form-group input { flex: 1; min-width: 120px; padding: 12px; border-radius: 12px; border: 2px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary); }
        .status-message { margin-top: 15px; padding: 12px; border-radius: 12px; display: none; }
        .status-message.success { display: block; background: rgba(48, 209, 88, 0.1); color: var(--accent-green); }
        .status-message.error { display: block; background: rgba(255, 55, 95, 0.1); color: var(--accent-pink); }
        .live-indicator { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(48, 209, 88, 0.1); border: 2px solid var(--accent-green); border-radius: 50px; font-size: 0.85rem; color: var(--accent-green); margin-bottom: 20px; }
        .live-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--text-secondary); text-decoration: none; }
        .back-link:hover { color: var(--accent-blue); }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Challenge</a>
        <div class="header">
            <h1>🏆 Global Leaderboard</h1>
            <p>Speak It Out Episode 1 - Challenge Rankings</p>
            <div class="live-indicator"><span class="live-dot"></span><span>Live Updates</span></div>
        </div>
        <div class="submit-form">
            <h3>📝 Submit Your Score</h3>
            <div class="form-group">
                <input type="text" id="submitName" placeholder="Your name" maxlength="20">
                <input type="number" id="submitTime" placeholder="Time (seconds)" min="0">
                <input type="number" id="submitAccuracy" placeholder="Accuracy %" value="100">
                <button class="btn" onclick="submitScore()">Submit</button>
            </div>
            <div class="status-message" id="statusMessage"></div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="value" id="totalPlayers">0</div><div class="label">Total Players</div></div>
            <div class="stat-card"><div class="value" id="bestTime">--:--</div><div class="label">Best Time</div></div>
            <div class="stat-card"><div class="value" id="avgAccuracy">0%</div><div class="label">Avg Accuracy</div></div>
        </div>
        <div class="leaderboard-card">
            <h2>🏅 Top 100 Players</h2>
            <ul class="leaderboard-list" id="leaderboardList"></ul>
        </div>
        <div class="actions" style="display:flex;gap:15px;justify-content:center;flex-wrap:wrap;">
            <a href="index.html" class="btn">🎮 Start Challenge</a>
            <button class="btn btn-secondary" onclick="exportData()">📤 Export</button>
            <label class="btn btn-secondary" style="cursor:pointer;">📥 Import<input type="file" accept=".json" onchange="importData(this.files[0])" style="display:none;"></label>
        </div>
    </div>
    <script>
        const LOCAL_KEY = 'speakItOut_global_leaderboard';
        const API_URL = 'https://speak-it-out.vercel.app/api/leaderboard';
        function getLocal() { const s = localStorage.getItem(LOCAL_KEY); return s ? JSON.parse(s) : [{name:'Sarah M.',time:185,date:'2026-04-22',accuracy:95},{name:'John D.',time:203,date:'2026-04-21',accuracy:88},{name:'Emma L.',time:217,date:'2026-04-23',accuracy:92}]; }
        function formatTime(sec) { const m=Math.floor(sec/60),s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
        async function submitScore() {
            const name=document.getElementById('submitName').value.trim(),time=parseInt(document.getElementById('submitTime').value),acc=parseInt(document.getElementById('submitAccuracy').value)||100;
            const statusEl=document.getElementById('statusMessage');
            if(!name||!time){statusEl.className='status-message error';statusEl.textContent='⚠️ Please enter name and time';return;}
            try {
                const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,time,accuracy:acc})});
                const result=await res.json();
                if(result.success){statusEl.className='status-message success';statusEl.textContent='✅ Score submitted! Rank: #'+result.rank;renderLeaderboard();}
                else throw new Error(result.error);
            } catch(e) {
                const local=getLocal();local.push({name,time,accuracy:acc,date:new Date().toISOString().split('T')[0]});local.sort((a,b)=>a.time-b.time);localStorage.setItem(LOCAL_KEY,JSON.stringify(local.slice(0,100)));
                statusEl.className='status-message success';statusEl.textContent='✅ Saved locally (offline mode)';renderLeaderboard();
            }
        }
        async function renderLeaderboard() {
            let lb;
            try { const res=await fetch(API_URL);if(res.ok){const r=await res.json();if(r.success){lb=r.data;localStorage.setItem(LOCAL_KEY,JSON.stringify(lb));}} }catch(e){}
            if(!lb) lb=getLocal();
            document.getElementById('totalPlayers').textContent=lb.length;
            document.getElementById('bestTime').textContent=lb.length?formatTime(lb[0].time):'--:--';
            document.getElementById('avgAccuracy').textContent=lb.length?Math.round(lb.reduce((s,p)=>s+(p.accuracy||0),0)/lb.length)+'%':'0%';
            const list=document.getElementById('leaderboardList');list.innerHTML='';
            lb.slice(0,100).forEach((e,i)=>{
                const rc=i<3?'rank-'+(i+1):'rank-other',rd=i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1);
                list.innerHTML+='<li class="leaderboard-item"><div class="rank '+rc+'">'+rd+'</div><div class="player-info"><div class="player-name">'+escapeHtml(e.name)+'</div><div class="player-date">'+e.date+'</div></div><div class="player-time">'+formatTime(e.time)+'</div><div class="player-accuracy">'+e.accuracy+'%</div></li>';
            });
        }
        function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
        function exportData(){const lb=getLocal(),ds=JSON.stringify(lb,null,2),du='data:application/json;charset=utf-8,'+encodeURIComponent(ds),a=document.createElement('a');a.href=du;a.download='leaderboard.json';a.click();}
        function importData(f){const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(Array.isArray(d)){const c=getLocal(),m=[...c,...d].sort((a,b)=>a.time-b.time).slice(0,100);localStorage.setItem(LOCAL_KEY,JSON.stringify(m));renderLeaderboard();alert('Imported!');}}catch(err){alert('Invalid file');}};r.readAsText(f);}
        setInterval(renderLeaderboard,10000);renderLeaderboard();
    </script>
</body>
</html>
